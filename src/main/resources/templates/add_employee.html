<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <title>Employee Directory</title>
</head>

<body>
    <div class="d-flex justify-content-center">
      <form action='#' th:action="@{/employees/add}" th:object="${employee}"
      method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-outline">
          <label class="form-label" for="input1">First Name</label>
          <input type="text" th:field="*{firstName}" id="input1" class="form-control" required/>
          <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>

        <div class="form-outline">
          <label class="form-label" for="input2">Last Name</label>
          <input type="text" th:field="*{lastName}" id="input2" class="form-control" required/>
          <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </div>

        <div class="form-outline">
          <label class="form-label" for="input3">Email</label>
          <input type="email" th:field="*{email}" id="input3" class="form-control" required/>
          <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <br>
        <button type="submit" value="Login" class="btn btn-primary">Add</button>
      </form>
    </div>
</body>
</html>
