<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <form action='#' th:action="@{/login}" method="post" style="max-width: 350px; margin: 0 auto;" >
        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username and password.
        </div>
        <div th:if="${param.logout}" class="alert alert-danger">
            you are logout
        </div>
            <!-- Email input -->
            <div class="form-outline mb-4">
                <input type="username" name="username" id="form2Example1" class="form-control" />
                <label class="form-label" for="form2Example1">Email address</label>
            </div>

            <!-- Password input -->
            <div class="form-outline mb-4">
                <input type="password" name="password" id="form2Example2" class="form-control" />
                <label class="form-label" for="form2Example2">Password</label>
            </div>


            <!-- Submit button -->
            <button type="submit" value="Login" class="btn btn-primary btn-block mb-4">Sign in</button>

            <!-- Register buttons -->
            <div>
                <p class="mb-0">Don't have an account? <a th:href="@{/registration/test}">Sign up</a>
                </p>
            </div>
    </form>

</body>
</html>
