<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Getting Started: Serving Web Content</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<form action='#' th:action="@{/registration/register}" th:object="${user}"
      method="post" style="max-width: 350px; margin: 0 auto;">


    <div class="border border-secondary p-3 rounded">
        <p>Access to Shopme Control Panel</p>
        <p>
            <input type="text" th:field="*{username}" class="form-control" placeholder="username" />
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </p>
        <p>
            <input type="text" th:field="*{password}" class="form-control" placeholder="Password" />
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </p>

        <p>
            <input type="text" th:field="*{firstName}" class="form-control" placeholder="firstName"  />
            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </p>
        <p>
            <input type="text" th:field="*{lastName}" class="form-control" placeholder="lastName"  />
            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </p>
<!--        <p th:object="${user.role}">-->
<!--            <input type="text" name="role" class="form-control" placeholder="role" required />-->
<!--        </p>-->

        <p>
            <input type="submit" value="Login" class="btn btn-primary" />
        </p>
        <a th:href="@{/loginF}">Log in</a>
    </div>
</form>
</body>
</html>
